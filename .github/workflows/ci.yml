name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: python -m pytest

  # Publishes the README badge from the real result of the test job:
  # green "passed" on success, red "failed" otherwise. Pushes to main only.
  badge:
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write badge to the badges branch
        env:
          RESULT: ${{ needs.test.result }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$RESULT" = "success" ]; then msg=passed; color=1baf7a; else msg=failed; color=e34948; fi
          mkdir badge && cd badge
          printf '{"schemaVersion": 1, "label": "CI", "message": "%s", "color": "%s"}\n' "$msg" "$color" > ci.json
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci.json
          git commit -q -m "CI badge: $msg"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
