[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "land-blind"
version = "1.0.0"
description = "Pre-registered test of whether AI weather ensembles miss the soil moisture they never see."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohan Bali" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "xarray>=2024.10",
    "netCDF4>=1.6",
    "zarr>=3.0",
    "numcodecs>=0.13",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
maps = ["cartopy>=0.24"]
dev = ["pytest>=8", "ruff==0.17.5", "mypy==2.4.1", "types-PyYAML"]

[project.urls]
Repository = "https://github.com/rohanbalixz/land-blind"

[project.scripts]
landblind = "landblind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
ignore = ["N802", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
