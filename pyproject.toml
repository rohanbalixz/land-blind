[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "land-memory"
version = "0.1.0"
description = "Tests whether AI weather ensembles miss the soil moisture they never see."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rohan Bali" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "xarray>=2024.10",
    "zarr>=3.0",
    "numcodecs>=0.13",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
maps = ["cartopy>=0.24"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
landmem = "landmem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
ignore = ["N802", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
