# Exact environment used for the published results (conda-forge, macOS arm64 and Linux x86-64).
name: landblind
channels:
  - conda-forge
dependencies:
  - python=3.12.16
  - numpy=2.5.5
  - pandas=3.1.1
  - scipy=1.18.1
  - xarray=2025.12.0
  - zarr=3.4.2
  - numcodecs=0.17.1
  - netcdf4=1.7.5
  - matplotlib=3.11.2
  - cartopy=0.26.0
  - pyyaml=6.0.3
  - pytest=9.2.0
  - ruff=0.17.5
  - pip
  - pip:
      - -e .
